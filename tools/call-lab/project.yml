name: CallLab
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  developmentLanguage: en
packages:
  CallLabKit:
    path: Packages/CallLabKit
  RNNoiseLab:
    path: Packages/RNNoiseLab
  WebRTCBinary:
    path: ../../apps/apple/Packages/WebRTCBinary
# The lab's bundle ID is the app ID (apps/apple/AppID.xcconfig) plus .calllab.
configFiles:
  Debug: ../../apps/apple/AppID.xcconfig
  Release: ../../apps/apple/AppID.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: 'YES'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
targets:
  CallLabiOS:
    type: application
    platform: iOS
    sources:
      - path: CallLab
        excludes: ['Mac/**']
    dependencies:
      - package: CallLabKit
      - package: RNNoiseLab
      - package: WebRTCBinary
        product: WebRTC
    info:
      path: Generated/CallLabiOS-Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).calllab
        PRODUCT_NAME: CallLab
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Call Lab measures calls.
        INFOPLIST_KEY_NSCameraUsageDescription: Call Lab measures video calls.
  CallLabMac:
    type: application
    platform: macOS
    sources:
      - path: CallLab
        excludes: ['iOS/**']
    dependencies:
      - package: CallLabKit
      - package: WebRTCBinary
        product: WebRTC
    entitlements:
      path: Generated/CallLabMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).calllab
        PRODUCT_NAME: CallLab
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Call Lab measures calls.
        INFOPLIST_KEY_NSCameraUsageDescription: Call Lab measures video calls.

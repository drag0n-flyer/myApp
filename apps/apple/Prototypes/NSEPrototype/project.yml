name: NSEPrototype
options:
  bundleIdPrefix: org.example.app
  deploymentTarget:
    iOS: '17.0'
packages:
  SecureMessaging:
    path: ../../Packages/SecureMessaging
configFiles:
  Debug: Prototype.xcconfig
  Release: Prototype.xcconfig
settings:
  base:
    # A throwaway prototype: Swift 5 mode avoids Sendable noise around the notification content handler.
    SWIFT_VERSION: '5.0'
    # Team and signing identity come from Prototype.xcconfig (do not set them here).
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: 'YES'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  NSEProtoHost:
    type: application
    platform: iOS
    sources:
      - path: Host
        excludes: ['*.entitlements']
    info:
      path: Generated/NSEProtoHost-Info.plist
      properties:
        MLSKeychainAccessGroup: $(AppIdentifierPrefix)org.example.app.nseproto.shared
    dependencies:
      - package: SecureMessaging
        product: SecureMessaging
      - target: NSEProtoService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app.nseproto
        CODE_SIGN_ENTITLEMENTS: Host/Host.entitlements
  NSEProtoService:
    type: app-extension
    platform: iOS
    sources:
      - path: Service
        excludes: ['*.entitlements']
    info:
      path: Generated/NSEProtoService-Info.plist
      properties:
        CFBundleDisplayName: NSEProtoService
        MLSKeychainAccessGroup: $(AppIdentifierPrefix)org.example.app.nseproto.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    dependencies:
      - package: SecureMessaging
        product: SecureMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app.nseproto.nse
        SKIP_INSTALL: 'YES'
        CODE_SIGN_ENTITLEMENTS: Service/Service.entitlements
schemes:
  NSEProtoHost:
    build:
      targets:
        NSEProtoHost: all

name: App
options:
  bundleIdPrefix: org.example.app
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  developmentLanguage: en
packages:
  AppCore:
    path: Packages/AppCore
  ServerKit:
    path: Packages/ServerKit
  LocalStore:
    path: Packages/LocalStore
  Messaging:
    path: Packages/Messaging
  SecureMessaging:
    path: Packages/SecureMessaging
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    PASSKEY_DOMAINS: home.example.org
    DEFAULT_SERVER_HOST: home.example.org
    PUSH_GATEWAY_URL: https://push.example.org
    PUSH_GATEWAY_KEY: ''
    # Keep NotificationService/NSE-*-filtering.entitlements identical to the plain files plus the filtering key.
    NSE_FILTERING: 'NO'
    NSE_FILTERING_YES_SUFFIX: '-filtering'
    NSE_FILTERING_NO_SUFFIX: ''
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: 'YES'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
  configs:
    Debug:
      APNS_ENVIRONMENT: sandbox
    Release:
      APNS_ENVIRONMENT: production
    LOCALIZATION_PREFERS_STRING_CATALOGS: 'YES'
    SWIFT_EMIT_LOC_STRINGS: 'YES'
targets:
  AppiOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ['*.entitlements']
    info:
      path: Generated/AppiOS-Info.plist
      properties:
        DefaultServerHost: $(DEFAULT_SERVER_HOST)
        PasskeyDomains: $(PASSKEY_DOMAINS)
        PushGatewayURL: $(PUSH_GATEWAY_URL)
        PushGatewayKey: $(PUSH_GATEWAY_KEY)
        APNSEnvironment: $(APNS_ENVIRONMENT)
        KeychainAccessGroup: $(AppIdentifierPrefix)org.example.app.shared
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_NAME: App
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app
        CODE_SIGN_ENTITLEMENTS: App/AppiOS.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: So people can hear you on calls.
        INFOPLIST_KEY_NSCameraUsageDescription: To scan invite and device-linking QR codes, and for video calls.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - package: AppCore
      - package: ServerKit
        product: ServerKit
      - target: AppNSEiOS
  AppMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ['*.entitlements']
    info:
      path: Generated/AppMac-Info.plist
      properties:
        DefaultServerHost: $(DEFAULT_SERVER_HOST)
        PasskeyDomains: $(PASSKEY_DOMAINS)
        PushGatewayURL: $(PUSH_GATEWAY_URL)
        PushGatewayKey: $(PUSH_GATEWAY_KEY)
        APNSEnvironment: $(APNS_ENVIRONMENT)
        KeychainAccessGroup: $(AppIdentifierPrefix)org.example.app.shared
    settings:
      base:
        PRODUCT_NAME: App
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app.mac
        CODE_SIGN_ENTITLEMENTS: App/AppMac.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: So people can hear you on calls.
        INFOPLIST_KEY_NSCameraUsageDescription: For video calls.
        ENABLE_HARDENED_RUNTIME: 'YES'
    dependencies:
      - package: AppCore
      - package: ServerKit
        product: ServerKit
      - target: AppNSEMac
  AppNSEiOS:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes: ['*.entitlements']
    info:
      path: Generated/AppNSEiOS-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        KeychainAccessGroup: $(AppIdentifierPrefix)org.example.app.shared
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app.nse
        CODE_SIGN_ENTITLEMENTS: NotificationService/NSE-iOS$(NSE_FILTERING_$(NSE_FILTERING)_SUFFIX).entitlements
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: 'YES'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) NSE_FILTERING_$(NSE_FILTERING)'
    dependencies:
      - package: AppCore
      - package: Messaging
        product: Messaging
      - package: LocalStore
        product: LocalStore
      - package: ServerKit
        product: ServerKit
      - package: SecureMessaging
        product: SecureMessaging
  AppNSEMac:
    type: app-extension
    platform: macOS
    sources:
      - path: NotificationService
        excludes: ['*.entitlements']
    info:
      path: Generated/AppNSEMac-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        KeychainAccessGroup: $(AppIdentifierPrefix)org.example.app.shared
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app.mac.nse
        CODE_SIGN_ENTITLEMENTS: NotificationService/NSE-Mac$(NSE_FILTERING_$(NSE_FILTERING)_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: 'YES'
        SKIP_INSTALL: 'YES'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) NSE_FILTERING_$(NSE_FILTERING)'
    dependencies:
      - package: AppCore
      - package: Messaging
        product: Messaging
      - package: LocalStore
        product: LocalStore
      - package: ServerKit
        product: ServerKit
      - package: SecureMessaging
        product: SecureMessaging
  AppiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests/Shared
      - path: AppUITests/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app.uitests
        TEST_TARGET_NAME: AppiOS
    dependencies:
      - target: AppiOS
      - package: SecureMessaging
        product: SecureMessagingCore
  AppMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AppUITests/Shared
      - path: AppUITests/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.app.mac.uitests
        TEST_TARGET_NAME: AppMac
    dependencies:
      - target: AppMac
schemes:
  AppiOS:
    build:
      targets:
        AppiOS: all
        AppiOSUITests: [test]
    test:
      targets:
        - AppiOSUITests
  AppMac:
    build:
      targets:
        AppMac: all
        AppMacUITests: [test]
    test:
      targets:
        - AppMacUITests

# coturn for one relay node of [App] calls (TLS on 443, no reverse proxy here).
# coturn does not expand variables itself. This file is a template: render it
# on the relay host with
#   TURN_SECRET=<APP_TURN_SECRET> TURN_REALM=turn1.example.org EXTERNAL_IP=<public ip> \
#     envsubst '${TURN_SECRET} ${TURN_REALM} ${EXTERNAL_IP}' < turnserver.conf > turnserver.rendered.conf
# and relay/compose.yaml mounts the rendered file. Never commit the rendered file.
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}

listening-port=3478
tls-listening-port=443
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem

# The public address of this host (and, behind NAT, /<private ip>).
external-ip=${EXTERNAL_IP}
min-port=49152
max-port=65535

# Limits: at most 12 relay sessions per credential, 1000 on the whole node.
user-quota=12
total-quota=1000

# Never relay to private or local address ranges.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff

# No logging: coturn would otherwise write peer addresses (server design, section 8).
# To debug, remove these three lines and add `verbose`, then put them back.
no-stdout-log
log-file=/dev/null
simple-log

no-multicast-peers

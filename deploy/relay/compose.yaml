# One relay node: coturn alone, on its own host (not the app server).
# Render turnserver.conf first (see the comment at the top of that file), then:
#   docker compose up -d
# Certificates for turns: on 443 are copied to ./certs by the certbot renewal
# hook (see docs/ops/beta-runbook.md).
services:
  coturn:
    image: coturn/coturn:4.18
    restart: unless-stopped
    network_mode: host
    # TLS on 443 needs the right to bind a port below 1024. Also set
    # net.ipv4.ip_unprivileged_port_start=0 on the host (see the runbook).
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./turnserver.rendered.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/certs:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

# coturn for [App] calls. The server hands out time-limited credentials made
# from the shared secret, so coturn needs no user database.
# coturn does not expand ${TURN_SECRET}. This file is a template: render it with
#   TURN_SECRET=<APP_TURN_SECRET> envsubst '${TURN_SECRET}' < turnserver.conf > turnserver.rendered.conf
# and compose.yaml mounts the rendered file. Never commit the rendered file.
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=chat.example.org

listening-port=3478
tls-listening-port=443
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem

# Never relay to private or local address ranges.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-multicast-peers

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Admins - Server admin</title>
<link rel="stylesheet" href="static/admin.css">
</head>
<body data-page="admins">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site">
    <p class="brand">Server admin</p>
    <p class="who" id="who"></p>
    <nav id="nav" aria-label="Admin sections"></nav>
</header>
<main id="main">
<h1>Admins</h1>
<div id="notice"></div>
<div id="admin-list" aria-busy="true"></div>
<h2>Add an admin</h2>
<form id="add-form" class="login" method="post">
<div class="field">
<label for="new-username">Username</label>
<input type="text" id="new-username" autocomplete="off" autocapitalize="off" spellcheck="false" required>
<p class="hint">3 to 32 characters: letters, digits, dot, underscore or hyphen.</p>
</div>
<div class="field">
<label for="new-password">Password</label>
<input type="password" id="new-password" autocomplete="new-password" required>
<p class="hint">At least 12 characters.</p>
</div>
<div class="field">
<label for="new-confirm">Confirm password</label>
<input type="password" id="new-confirm" autocomplete="new-password" required>
</div>
<button type="submit" id="add-admin">Add admin</button>
</form>
</main>
<noscript>This page needs JavaScript.</noscript>
<script type="module" src="static/common.js"></script>
<script type="module" src="static/admins.js"></script>
</body>
</html>

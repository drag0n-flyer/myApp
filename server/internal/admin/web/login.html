<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in - Server admin</title>
<link rel="stylesheet" href="static/admin.css">
</head>
<body data-page="login">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site">
    <p class="brand">Server admin</p>
</header>
<main id="main">
<h1>Sign in</h1>
<div id="notice"></div>
<form id="login-form" class="login" method="post">
<div class="field">
<label for="token">Admin token</label>
<input type="password" id="token" autocomplete="off" required>
</div>
<button type="submit" id="sign-in">Sign in</button>
</form>
<p>Create a token on the server with <code>appserver admin token create</code>. Each token works once.</p>
</main>
<noscript>This page needs JavaScript.</noscript>
<script type="module" src="static/common.js"></script>
<script type="module" src="static/login.js"></script>
</body>
</html>

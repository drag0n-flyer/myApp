name: iPhone install command

on:
  push:
    paths:
      - Makefile
      - scripts/iphone.py
      - scripts/test_iphone.py
      - apps/apple/iPhone.local.xcconfig.example
      - .github/workflows/iphone-command.yml
  pull_request:
    paths:
      - Makefile
      - scripts/iphone.py
      - scripts/test_iphone.py
      - apps/apple/iPhone.local.xcconfig.example
      - .github/workflows/iphone-command.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and install command tests (fake tools, no signing credentials)
        run: python3 -m unittest discover -s scripts -p test_iphone.py
      - name: Check Apple command availability
        if: runner.os == 'macOS'
        run: |
          xcrun devicectl help device install app
          xcrun xcdevice list > "$RUNNER_TEMP/iphone-devices.json"
          python3 -c 'import json, sys; assert isinstance(json.load(open(sys.argv[1])), list)' "$RUNNER_TEMP/iphone-devices.json"

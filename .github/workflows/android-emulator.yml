name: android-emulator

on:
  workflow_dispatch:
  push:
    branches-ignore: [feat/server]
    paths:
      - 'apps/android/**'
      - 'scripts/android-live-server.sh'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'scripts/android-live-server.sh'
      - '.github/workflows/android-emulator.yml'

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Two runs were killed by a runner shutdown as the :app emulators started (E5b); free the unused toolchains
      # as webrtc-android.yml does. The Android SDK (/usr/local/lib/android) stays.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Native library for :mls instrumented tests (x86_64 comes from the same cross-build as android.yml's mlsffi-android job).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/apple/Packages/SecureMessaging/mlsffi/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('apps/apple/Packages/SecureMessaging/mlsffi/Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-
      - uses: actions/cache@v4
        id: cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}
      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install --locked --version 4.1.2 cargo-ndk
      - name: Install the NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Fetch the RNNoise model (checksum verified)
        run: scripts/android-fetch-rnnoise-model.sh
      - name: Cross-build mlsffi
        timeout-minutes: 25
        run: scripts/build-mlsffi-android.sh
      - name: Cache the emulator system images and AVDs
        id: images
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            /usr/local/lib/android/sdk/emulator
            ~/.android/gradle
          key: avd-${{ runner.os }}-api29-api36-x86_64-v1
      - name: Install the emulator and system images
        timeout-minutes: 15
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" \
            "system-images;android-29;default;x86_64" "system-images;android-36;default;x86_64" >/dev/null
      # LiveSmokeTest talks to the real Go server on the host (10.0.2.2 from the emulators).
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            tools/smtp-sink/go.mod
      - name: Start the Go server for LiveSmokeTest
        timeout-minutes: 10
        run: scripts/android-live-server.sh
      - name: Instrumented tests on API 29 and API 36
        working-directory: apps/android
        timeout-minutes: 45
        run: |
          df -h /
          free -m
          ./gradlew --no-daemon --continue -PliveServer=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.androidTest.numManagedDeviceShards=1 \
            :mls:pixel6Api29DebugAndroidTest :mls:pixel6Api36DebugAndroidTest \
            :store:pixel6Api29DebugAndroidTest :store:pixel6Api36DebugAndroidTest \
            :auth:pixel6Api29DebugAndroidTest :auth:pixel6Api36DebugAndroidTest \
            :calls-android:pixel6Api29DebugAndroidTest :calls-android:pixel6Api36DebugAndroidTest \
            :app:pixel6Api29DebugAndroidTest :app:pixel6Api36DebugAndroidTest
      # Every module must have run at least its known test count on both API levels, none skipped (no silent no-op).
      - name: Disk and memory after the tests
        if: always()
        run: |
          df -h /
          free -m
      - name: Check that every instrumented test ran
        if: always()
        run: scripts/check-emulator-results.py apps/android mls:1 store:1 auth:8 calls-android:1 app:4 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: |
            apps/android/*/build/reports/androidTests
            apps/android/*/build/outputs/androidTest-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Go server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/android-live/appserver.log" || true

  android-emulator-ci:
    # Fails closed: a failed, cancelled or skipped emulator job fails it.
    if: always()
    needs: [emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the emulator job result
        env:
          RESULT: ${{ needs.emulator.result }}
        run: |
          echo "emulator: $RESULT"
          [ "$RESULT" = success ]

name: mutation

# Information only: no threshold. gremlins v0.5.0 (checked with
# `go list -m -versions github.com/go-gremlins/gremlins`).
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gremlins:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: Mutation testing
        run: |
          mkdir -p ../mutation-report
          for pkg in pushproto delivery identity calls; do
            go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0 unleash \
              -o "../mutation-report/$pkg.json" "./internal/$pkg" \
              | tee "../mutation-report/$pkg.txt" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation-report

name: Apple apps

on:
  push:
    # feat/server mirrors main; building it again only doubles the Mac queue.
    branches-ignore: [feat/server]
    paths:
      - "apps/apple/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apps/apple/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: AppCore tests
        working-directory: apps/apple/Packages/AppCore
        run: swift test --no-parallel
      - name: LocalStore tests
        working-directory: apps/apple/Packages/LocalStore
        run: swift test --no-parallel
      - name: ServerKit tests
        working-directory: apps/apple/Packages/ServerKit
        run: swift test --no-parallel

  packages-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            apps/apple/Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/apple/Packages/*/Package.swift', 'apps/apple/Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: LocalStore tests
        working-directory: apps/apple/Packages/LocalStore
        run: swift test
      - name: LocalStore tests on iOS Simulator
        working-directory: apps/apple/Packages/LocalStore
        run: xcodebuild -scheme LocalStore test -destination 'platform=iOS Simulator,name=iPhone 16'
      - name: Messaging tests
        if: hashFiles('apps/apple/Packages/Messaging/Package.swift') != ''
        working-directory: apps/apple/Packages/Messaging
        run: swift test

  serverkit-ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            apps/apple/Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/apple/Packages/*/Package.swift', 'apps/apple/Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: ServerKit tests on an iOS simulator
        run: apps/apple/scripts/test-serverkit-ios.sh
      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serverkit-ios-xcresult
          path: ${{ runner.temp }}/serverkit-ios.xcresult

  ios:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: No test-only libraries in the app
        run: apps/apple/scripts/check-test-only-libs.sh
      - name: Release config check (reports only)
        continue-on-error: true
        run: python3 scripts/check-release-config.py --allow-missing --placeholder-brand-ok --filtering-pending
      - name: iPhone UI tests
        run: apps/apple/scripts/test-ios.sh
      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-xcresult
          path: ${{ runner.temp }}/ios-ui.xcresult

  macos:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: No test-only libraries in the app
        run: apps/apple/scripts/check-test-only-libs.sh
      - name: Mac UI tests
        run: apps/apple/scripts/test-macos.sh
      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-ui-xcresult
          path: ${{ runner.temp }}/mac-ui.xcresult

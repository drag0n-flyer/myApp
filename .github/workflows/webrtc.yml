name: webrtc

# Builds the custom WebRTC XCFramework (tools/webrtc). Every file under
# tools/webrtc/ and this workflow need the owner's review before merge.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release after the smoke tests pass
        type: boolean
        default: false
      slices:
        description: JSON list of slices to build (a partial list skips package, smoke and release)
        type: string
        default: ""
      reuse_run:
        description: Space-separated run ids whose slice-* artifacts the package job also uses (so a rerun builds only the slices that failed)
        type: string
        default: ""
  push:
    # Hours per build: only its own branch builds on push; elsewhere start it by hand.
    branches: [feat/webrtc-build]
    paths:
      - "tools/webrtc/**"
      - ".github/workflows/webrtc.yml"

permissions:
  contents: read

env:
  ALL_SLICES: '["ios-arm64","ios-sim-arm64","ios-sim-x64","mac-arm64","mac-x64"]'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      slices: ${{ steps.slices.outputs.slices }}
      full: ${{ steps.slices.outputs.full }}
      reuse: ${{ steps.slices.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - name: Opus probe
        run: sh tools/webrtc/opus-probe/run-tests.sh
      - name: Opus DNN list generator
        run: python3 -m unittest tools/webrtc/opus/test_gen_dnn_gni.py
      - name: apply.sh
        run: sh tools/webrtc/apply_test.sh
      - name: Build scripts (symbols, license scan, gn arguments)
        run: sh tools/webrtc/build_scripts_test.sh
      - name: Choose slices
        id: slices
        env:
          REQUESTED: ${{ inputs.slices || vars.WEBRTC_SLICES }}
          REUSE: ${{ inputs.reuse_run || vars.WEBRTC_REUSE_RUN }}
        run: |
          slices="${REQUESTED:-$ALL_SLICES}"
          echo "slices=$slices" >> "$GITHUB_OUTPUT"
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          if [ -n "$REUSE" ] || [ "$(echo "$slices" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 5 ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: probe
    if: needs.probe.outputs.slices != '[]'
    runs-on: macos-26
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.probe.outputs.slices) }}
    env:
      WORK: /Users/runner/webrtc-work
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h /
          selected=$(xcode-select -p | sed -E 's#(/Applications/[^/]+\.app)/.*#\1#')
          echo "selected Xcode: $selected"
          for x in /Applications/Xcode_*.app; do
            [ "$x" = "$selected" ] || { echo "removing $x"; sudo rm -rf "$x"; }
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet
          df -h /
      # The Opus tarball is fetched once and reused: downloads.xiph.org has failed whole builds.
      # apply.sh checks the SHA-256 of a cached file too, so a bad cache entry stops the build.
      - name: Opus tarball cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/webrtc-cache
          key: opus-b7637334527201fdfd6dd6a02e67aceffb0e5e60155bbd89175647a80301c92c
      - name: Build ${{ matrix.slice }}
        env:
          APPLY_CACHE_DIR: ${{ runner.temp }}/webrtc-cache
        run: sh tools/webrtc/build.sh "${{ matrix.slice }}" "$WORK"
      - name: Disk after build
        if: always()
        run: df -h /
      - name: Pack the slice
        run: tar -C "$WORK/artifacts" -cf "slice-${{ matrix.slice }}.tar" "${{ matrix.slice }}"
      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.slice }}
          path: slice-${{ matrix.slice }}.tar
          if-no-files-found: error
      - name: Licenses
        if: matrix.slice == 'ios-arm64'
        run: |
          mkdir -p "$WORK/licenses"
          cd "$WORK/src"
          python3 tools_webrtc/libs/generate_licenses.py --target //sdk:framework_objc "$WORK/licenses" out/ios-arm64
          ls -l "$WORK/licenses"
          cd "$GITHUB_WORKSPACE"
          sh tools/webrtc/package.sh --check-license "$WORK/licenses/LICENSE.md"
      - uses: actions/upload-artifact@v4
        if: matrix.slice == 'ios-arm64'
        with:
          name: licenses
          path: /Users/runner/webrtc-work/licenses
          if-no-files-found: error

  package:
    needs: [probe, build]
    if: ${{ !cancelled() && needs.probe.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) && needs.probe.outputs.full == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download slices from earlier runs
        if: needs.probe.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in ${{ needs.probe.outputs.reuse }}; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'slice-*' --pattern licenses --dir "downloaded-old/$id"
          done
      - uses: actions/download-artifact@v4
        continue-on-error: true # nothing to download when every slice came from earlier runs
        with:
          path: downloaded
      - name: Unpack slices
        run: |
          mkdir -p artifacts
          # Slices from an earlier run first; this run's slices replace them.
          for t in downloaded-old/*/slice-*/slice-*.tar downloaded/slice-*/slice-*.tar; do
            [ -f "$t" ] && tar -C artifacts -xf "$t"
          done
          true
          mkdir -p artifacts/licenses
          # This run's licenses win over an earlier run's.
          for d in downloaded-old/*/licenses downloaded/licenses; do
            [ -d "$d" ] && cp "$d"/* artifacts/licenses/
          done
          [ -f artifacts/licenses/LICENSE.md ]
          ls artifacts artifacts/licenses
      - name: Package
        run: sh tools/webrtc/package.sh artifacts release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          if-no-files-found: error

  smoke:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Unzip the XCFramework into the package
        run: |
          ditto -x -k release/WebRTC.xcframework.zip apps/apple/Packages/WebRTCBinary
          ls apps/apple/Packages/WebRTCBinary
      - name: swift test (arm64)
        working-directory: apps/apple/Packages/WebRTCBinary
        env:
          WEBRTC_LOCAL_XCFRAMEWORK: WebRTC.xcframework
        run: swift test
      - name: swift test (x86_64, Rosetta)
        working-directory: apps/apple/Packages/WebRTCBinary
        env:
          WEBRTC_LOCAL_XCFRAMEWORK: WebRTC.xcframework
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          # Run SwiftPM itself under Rosetta: a native swift test launches the
          # arm64 test helper, which cannot load the x86_64 test bundle.
          arch -x86_64 /usr/bin/uname -m
          arch -x86_64 swift test --arch x86_64
      - name: xcodebuild test (iOS Simulator)
        working-directory: apps/apple/Packages/WebRTCBinary
        env:
          WEBRTC_LOCAL_XCFRAMEWORK: WebRTC.xcframework
        run: |
          name="iPhone 17"
          xcrun simctl list devices available | grep -q "$name (" || \
            name=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          echo "simulator: $name"
          xcodebuild test -scheme WebRTCBinary -destination "platform=iOS Simulator,name=$name"

  release:
    needs: [probe, smoke]
    if: ${{ !cancelled() && inputs.release && needs.smoke.result == 'success' && needs.probe.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/webrtc/VERSION
          tag="webrtc-m${WEBRTC_MILESTONE}.${RELEASE}"
          cat > notes.md <<NOTES
          WebRTC M${WEBRTC_MILESTONE} (${WEBRTC_BRANCH}, commit ${WEBRTC_COMMIT}) with libopus ${OPUS_VERSION}.

          Opus features: Deep PLC, OSCE (LACE and NoLACE), OSCE bandwidth extension. DRED is off.
          Decoder complexity 7. Packet lengths up to 120 ms. Hardware H.264 only (software H.264 and dav1d are off).
          Slices: iOS 17 device, iOS 17 simulator (arm64, x86_64), macOS 14 (arm64, x86_64).

          Device check: pending (plan 5)
          NOTES
          cd release
          gh release create "$tag" WebRTC.xcframework.zip WebRTC.dSYMs.zip LICENSE.md VERSION checksum.txt \
            --title "WebRTC M${WEBRTC_MILESTONE} + Opus ${OPUS_VERSION} (${RELEASE})" --notes-file ../notes.md
